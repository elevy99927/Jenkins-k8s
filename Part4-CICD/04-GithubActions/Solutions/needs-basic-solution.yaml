# Basic Exercise - sequential jobs with `needs`
# test -> build
name: needs-basic

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: echo "running tests"

  build:
    runs-on: ubuntu-latest
    needs: test            # build starts only after test succeeds
    steps:
      - run: echo "building app"
