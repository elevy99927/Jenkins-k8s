# Advanced Exercise - push to main + pull_request, different behavior per branch/event
#
#   pull_request  : test -> build -> pr-check
#   push to main  : test -> build -> deploy
name: needs-advanced

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: echo "running tests on ${{ github.ref_name }} - event ${{ github.event_name }}"

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - run: echo "building app"

  # runs only for pull requests
  pr-check:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    steps:
      - run: echo "PR number ${{ github.event.pull_request.number }} - ${{ github.head_ref }} -> ${{ github.base_ref }}"

  # runs only on push to main
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - run: echo "deploying to production from main"
